# Local zero-cost sandbox for the Crypto Governance Intelligence Platform.
#
# No top-level `version:` key — it is obsolete under Compose v2 and only emits a warning.
#
# Healthchecks here exist to sequence startup, not to prove correctness. Real verification
# lives in tests/integration/, which exercises each service's actual code path.
#
# No service pins `container_name`, and every host port is env-overridable. That is what
# lets scripts/verify.sh run the same file under a second Compose project with its own
# volumes: the acceptance harness destroys volumes by design, and it must never be able to
# take harvested data with it.

name: crypto-gov

# Shared Airflow config (Phase 7), referenced via `<<: *airflow-common` from each Airflow
# service below. A top-level extension field (the `x-` prefix), not a Compose-specific
# feature — YAML anchors are document-global regardless of nesting, but `x-` keys are the
# part Compose itself knows to ignore rather than mistake for a fourth service.
x-airflow-common: &airflow-common
  # Opt-in, not started by a plain `docker compose up`. Airflow's two extra JVM/Python
  # containers measurably strain CI's runner memory budget — added here after observing
  # Trino connection refusals in a run that had never seen them before Airflow joined the
  # default stack. The implementation plan's own risk table anticipated exactly this:
  # "Compose profiles so you can run subsets." `make airflow-up` passes --profile airflow;
  # verify.sh and a plain `make up` do not, so CI's resource footprint is unchanged from
  # before Phase 7 unless Airflow is deliberately requested.
  profiles: ["airflow"]
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: crypto-gov/airflow:2.10.3
  depends_on:
    postgres:
      condition: service_healthy
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/app/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${POSTGRES_USER:-engineer}:${POSTGRES_PASSWORD:-localdev}@postgres:5432/${POSTGRES_AIRFLOW_DB:-airflow}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local-dev-only-not-a-real-secret}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # PYTHONPATH is what makes `dags/`, `data_pipeline/`, `ai_agent/`, `config/` and
    # `tests/` all importable as top-level packages from inside the container — the same
    # mechanism the spark image already relies on (docker/spark/Dockerfile).
    PYTHONPATH: /opt/app
    # Internal, in-network endpoints — NOT the host-mapped ports .env.example documents
    # for use from the host. Overriding these three (rather than mounting .env, which
    # risks Docker creating a directory in its place on a fresh clone that has none yet)
    # is what lets harvest.py, build_silver.py and embeddings.py run unmodified in-container.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    MINIO_ENDPOINT: http://minio:9000
    TRINO_URL: http://trino:8080
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    MINIO_BUCKET: ${MINIO_BUCKET:-warehouse}
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    AWS_REGION: ${AWS_REGION:-us-east-1}
    # Passed straight through for the embed task. Blank OPENAI_API_KEY reproduces the
    # exact "OPENAI_API_KEY is not set" failure make embed already reports on the host.
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
    EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
    SPARK_CONTAINER_NAME: ${SPARK_CONTAINER_NAME:-crypto-gov-spark-1}
  volumes: &airflow-common-volumes
    - ./dags:/opt/app/dags:ro
    - ./data_pipeline:/opt/app/data_pipeline:ro
    - ./ai_agent:/opt/app/ai_agent:ro
    - ./config:/opt/app/config:ro
    - ./tests:/opt/app/tests:ro
    - airflow_logs:/opt/airflow/logs

services:

  # --- Relational + vector storage ---------------------------------------
  # Hosts three databases: application vectors, the Iceberg catalog's JDBC backend,
  # and (from Phase 7) Airflow metadata.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-engineer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB: ${POSTGRES_VECTOR_DB:-gov_vectors}
      POSTGRES_CATALOG_DB: ${POSTGRES_CATALOG_DB:-iceberg_catalog}
      POSTGRES_AIRFLOW_DB: ${POSTGRES_AIRFLOW_DB:-airflow}
    # HNSW builds that do not fit in maintenance_work_mem fall back to a much slower
    # on-disk build — minutes vs hours once Phase 4 embeds a real corpus. The 64MB
    # default already warns at 20k rows. shared_buffers matters separately: HNSW query
    # speed depends on the index being in cache rather than read from disk.
    command:
      - postgres
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-512MB}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - max_parallel_maintenance_workers=${POSTGRES_PARALLEL_MAINTENANCE_WORKERS:-3}
    ports:
      # Non-default host port: 5432 usually collides with a local Postgres install.
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      # Mounted outside initdb.d — a file mount *inside* a read-only directory mount
      # fails at container init. The init script applies this DDL with psql -f instead,
      # which keeps storage/ the single source of truth for schema.
      - ./storage:/opt/storage:ro
    healthcheck:
      # Liveness only. pg_isready succeeds well before the extension exists, which is
      # why tests/integration asserts on `vector` separately.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-engineer} -d ${POSTGRES_VECTOR_DB:-gov_vectors}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # --- Local S3 -----------------------------------------------------------
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # --- Bucket bootstrap ---------------------------------------------------
  # Without this the warehouse bucket never exists and Iceberg writes fail. Runs once
  # and exits; `docker compose down -v && up` re-runs it, which is what makes the
  # stack reproducible from zero rather than dependent on a bucket someone made by hand.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-warehouse}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET} &&
      echo 'bucket ready: '$${MINIO_BUCKET}
      "
    restart: "no"

  # --- Iceberg REST catalog ----------------------------------------------
  # Backed by Postgres. The stock configuration uses an in-container SQLite file, which
  # loses every table on `docker compose down` — the failure this stack must not have.
  iceberg-rest:
    # Thin layer over apache/iceberg-rest-fixture:1.9.2 adding the Postgres JDBC driver,
    # which the stock image omits. Version-matched to the Iceberg jars in docker/spark/.
    build:
      context: ./docker/iceberg-rest
    image: crypto-gov/iceberg-rest:1.9.2
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres:5432/${POSTGRES_CATALOG_DB:-iceberg_catalog}
      CATALOG_JDBC_USER: ${POSTGRES_USER:-engineer}
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      CATALOG_WAREHOUSE: s3://${MINIO_BUCKET:-warehouse}/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "${ICEBERG_REST_PORT:-8181}:8181"
    healthcheck:
      # TCP liveness for ordering. tests/integration hits /v1/config for the real assertion.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8181"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # --- Spark --------------------------------------------------------------
  # Local mode, not a master/worker pair: fewer moving parts to debug, and the cluster
  # topology adds nothing until there is data volume to justify it.
  spark:
    build:
      context: ./docker/spark
    image: crypto-gov/spark-iceberg:3.5.3
    depends_on:
      iceberg-rest:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - ./data_pipeline:/opt/app/data_pipeline:ro
      - ./storage:/opt/app/storage:ro
      - ./config:/opt/app/config:ro
      - ./tests:/opt/app/tests:ro
    command: ["sleep", "infinity"]
    healthcheck:
      # Asserts the Iceberg jars actually made it into the image — a silently broken
      # build would otherwise look healthy until the first query.
      test: ["CMD-SHELL", "ls /opt/spark/jars/iceberg-spark-runtime-*.jar /opt/spark/jars/iceberg-aws-bundle-*.jar"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # --- Trino --------------------------------------------------------------
  # An interactive SQL engine over the same Iceberg tables Spark writes. Spark pays ~20s
  # of JVM startup per query, which is fine for batch jobs and miserable for exploration;
  # Trino answers in about a second and speaks JDBC, so GUI clients can connect.
  trino:
    image: trinodb/trino:483
    depends_on:
      iceberg-rest:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${TRINO_PORT:-8090}:8080"
    volumes:
      # Only the catalog directory is mounted, so the image's own config.properties,
      # jvm.config and node.properties stay in place.
      - ./docker/trino/catalog:/etc/trino/catalog:ro
    healthcheck:
      # A real query, not a port probe — Trino accepts connections well before the
      # catalog is usable.
      test: ["CMD", "trino", "--execute", "SELECT 1"]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 40s

  # --- Airflow (Phase 7) ---------------------------------------------------
  # LocalExecutor, not the blueprint's SQLite-backed SequentialExecutor: the `airflow`
  # Postgres database has existed since Phase 1's init script specifically for this.
  # One-shot: migrates the metadata schema and creates the admin user, then exits. Every
  # other Airflow service waits on it completing successfully, matching the minio-init
  # pattern already established in Phase 1.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        airflow db migrate &&
        airflow users create --username ${AIRFLOW_ADMIN_USER:-admin}
        --password ${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname Admin --lastname User
        --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      # 8080 is Airflow's own default and also one of the most commonly already-occupied
      # local ports; mapped externally to 8082 to avoid the collision, same reasoning as
      # Postgres's non-default host port in Phase 1.
      - "${AIRFLOW_WEB_PORT:-8082}:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # Only the scheduler gets the Docker socket. Under LocalExecutor, task code runs as a
  # subprocess of the scheduler process — there is no separate "worker" service to reach
  # for — so the socket only needs to exist where task code actually runs. Mounting it
  # gives this one container root-equivalent control over the whole Docker host; that is
  # an accepted, contained trade for a local single-user demo stack and is exactly the
  # piece that does NOT carry over to AWS (see docs/phase-7-plan.md's AWS section) — MWAA
  # has no host to mount a socket from, which is why the Spark step becomes a real rewrite
  # rather than configuration at that point.
  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./dags:/opt/app/dags:ro
      - ./data_pipeline:/opt/app/data_pipeline:ro
      - ./ai_agent:/opt/app/ai_agent:ro
      - ./config:/opt/app/config:ro
      - ./tests:/opt/app/tests:ro
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$$HOSTNAME\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
  minio_data:
  airflow_logs:
