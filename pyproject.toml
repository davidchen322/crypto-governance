[project]
name = "crypto-gov-rag"
version = "0.1.0"
description = "Crypto Governance Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "psycopg[binary]>=3.1",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ai_agent*", "backend_api*", "config*", "data_pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need the docker stack, so they are opt-in. `make verify` selects them
# explicitly; `make test` stays fast and dependency-free.
addopts = "-m 'not integration and not live' -q"
markers = [
    "integration: requires the docker compose stack to be running",
    "seed: writes state that the persistence checks later assert survived a restart",
    "persistence: asserts state survived `docker compose down` (volumes retained)",
    "slow: multi-minute Spark runs; excluded from verify-fast",
    "live: hits third-party APIs; excluded from make verify so someone else's outage cannot fail the build",
]
