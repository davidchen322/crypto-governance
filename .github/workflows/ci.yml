name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Unit tests
        run: .venv/bin/pytest

  integration:
    name: Stack acceptance
    runs-on: ubuntu-latest
    # The full harness rebuilds the stack from zero and cycles it once; it needs
    # headroom well beyond the unit job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - name: Run verification harness
        run: ./scripts/verify.sh
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail=200
