# Iceberg REST catalog wiring for local development.
# The catalog is named `gov`; tables are addressed as gov.<namespace>.<table>.

spark.sql.extensions                       org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

spark.sql.catalog.gov                      org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.gov.type                 rest
spark.sql.catalog.gov.uri                  http://iceberg-rest:8181
spark.sql.catalog.gov.warehouse            s3://warehouse/
spark.sql.catalog.gov.io-impl              org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.gov.s3.endpoint          http://minio:9000
spark.sql.catalog.gov.s3.path-style-access true

# Keeps Spark from starting a Derby metastore and littering the working directory.
spark.sql.catalogImplementation            in-memory

# Docker Desktop has ~8 GB total on this machine; leave room for Postgres and MinIO.
spark.driver.memory                        2g
spark.ui.enabled                           false
