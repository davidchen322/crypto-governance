# Trino reads the same Iceberg REST catalog and the same MinIO bucket that Spark writes.
# Nothing is duplicated or synced — both engines resolve tables through the catalog, which
# is the interoperability the Iceberg format exists to provide.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://warehouse/

# Trino's own S3 filesystem, separate from Iceberg's S3FileIO and from Spark's s3a —
# three stacks, three configurations, one bucket.
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
