# ==========================================================================
# CROSS-SOURCE — answer requires both a proposal and its forum debate
# ==========================================================================

- id: cross-v4-fees-debate
  kind: cross_source
  question: What did the Uniswap forum say about activating v4 protocol fees?
  expect:
    - {source: forum, topic_id: 26162}
    - {source: proposal, id: "0x3fda3c04fa106ad45173011ef4dfa5db2f14cd35c3c3a7a40f067a44cbadd5f4"}
  notes: >
    Twenty-post thread with the same title as the proposal. The cleanest cross-source
    pair in the corpus — if this one fails, the join is not working at all.

- id: cross-four-for-v4-debate
  kind: cross_source
  question: What did delegates ask about the Four for V4 deployment?
  expect:
    - {source: forum, topic_id: 26150}
    - {source: proposal, id: "0x5ae3426216321df66a67eb677874b725f80e51888ad2da72b382b21669c554ee"}
  notes: >
    RFC thread, 8 posts. Checked: L2BEAT's governance team responded, and GFX Labs is
    answering questions about DAO operational overhead. Reception is broadly positive, so
    the question asks what delegates *asked* rather than what they objected to — the
    stronger wording would have made this unanswerable.

- id: cross-aave-v4-mainnet
  kind: cross_source
