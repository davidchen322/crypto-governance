  expect:
    - {source: forum, topic_id: 24293}
  notes: >
    Twenty-post ARFC thread. No matching Snapshot proposal in the current window —
    a case where the forum is ahead of the vote, which is exactly the early-warning
    signal the platform is supposed to surface.

