# Retrieval evaluation set — DRAFT, awaiting review
#
# Every question below was written against documents actually present in silver as of
# 15 Aug 2026, not invented. Titles and specifics come from the real corpus.
#
# HOW TO REVIEW
#   Cut anything you would not personally judge the same way twice. A question you are
#   unsure about is worse than no question, because a wobbly label makes the score wobble
#   for reasons that have nothing to do with retrieval quality.
#   Target 20 keepers. Over-drafting is deliberate; discarding is the point.
#
# FIELDS
#   id        stable slug, referenced in results
#   kind      lookup | thematic | cross_source | negative
#   question  asked verbatim of the retriever
#   expect    documents that SHOULD be retrieved. Empty list = nothing relevant exists.
#   notes     why this is the answer — the reasoning a future reader needs
#
# `expect` matches on document identity, not chunk. A proposal is matched if any chunk
# from it is retrieved.
#
# WHY NEGATIVES MATTER
#   A retriever always returns its top k. Ask it something the corpus cannot answer and it
#   will still hand the analyst five chunks, which the analyst will dutifully write a
#   confident answer from. Negatives are how that shows up as a number instead of as an
#   embarrassing demo.

# ==========================================================================
# LOOKUP — specific, factual, one or two clearly correct documents
# ==========================================================================

- id: aave-oracle-deprecation
  kind: lookup
  question: Which Aave proposal deprecates Chainlink price feeds for long-tail assets?
  expect:
    - {source: proposal, id: "0xaa683250ff2e2835b9ac945d6219a35cdca1d4134f49e3bce6763ca8d8944c08"}
  notes: >
    LlamaRisk proposal covering feeds Chainlink itself classified as high or very high
    operational risk. Should not be confused with the low-adoption asset deprecation
    below, which is a different LlamaRisk proposal about reserves rather than oracles.

- id: aave-low-adoption-offboarding
  kind: lookup
  question: Which Aave proposal offboards low-activity reserves and whole deployments?
  expect:
    - {source: proposal, id: "0x4ec0c13baf55472ecd538a2fae4bbdb60f30c96621a97ecf4db073b3e65597c7"}
  notes: >
    50 reserves plus 21 matured Pendle PTs across eleven deployments; whole-market
    deprecations on Sonic, Scroll, zkSync, Metis, Soneium and Aptos. The near-twin of the
    oracle proposal — a retriever that cannot separate these two is the failure this
    question exists to catch.

- id: ens-security-council-expiry
